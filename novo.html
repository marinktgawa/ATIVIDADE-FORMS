<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    form {
        max-width: 800px;
        margin: 0 auto;
        padding: 30px;
        background-color: rgb(247, 231, 245);
        border-radius: 12px;
        box-shadow: 0 4px 15px rgb(0, 0, 0, 0.08); 
    }

    fieldset {
        margin-bottom: 25px;
        padding: 20px;
        border: 1px solid #d9e2ec;
        border-radius: 10px;
        background-color: #d9e2ec;
    }
    legend{
        padding: 6px 12px;
    }
</style>
<body>
    <h1>CADASTRO DO USUÁRIO</h1>

    <form action="segunda.html" method="get">

         <label>Nome Completo:</label><br>
    <input type="text" name="nome" required><br><br>

    <label>Data de Nascimento:</label><br>
    <input type="date" name="data" required><br><br>

      <label>CPF:</label><br>
    <input type="text" name="cpf" maxlength="11" placeholder="Apenas números (11 dígitos)" required><br><br>

     <label>Gênero:</label><br>
    <select name="genero" required>
        <option value="">Selecione...</option>
        <option>Masculino</option>
        <option>Feminino</option>
        <option>Não-binário</option>
        <option>Não Definido</option>
        <option>Mulher Trans</option>
        <option>Homem Trans</option>
        <option>Outro</option>
    </select><br><br>

     <label>Telefone:</label><br>
    <input type="tel" name="telefone" placeholder="(XX) XXXXX-XXXX" required><br><br>

       <label>E-mail:</label><br>
    <input type="email" name="email" required><br><br>

    <label>Cidade:</label><br>
    <input type="text" name="cidade" required><br><br>

       <label>UF (Estado):</label><br>
    <select name="uf" required>
        <option value="">Selecione</option>
        <option>PE</option>
        <option>AL</option>
        <option>BA</option>
        <option>CE</option>
        <option>PB</option>
        <option>RN</option>
        <option>SE</option>
        <option>PI</option>
        <option>MA</option>
    </select><br><br>

      <input type="submit" value="Cadastrar">


    </form>
</body>
</html>
